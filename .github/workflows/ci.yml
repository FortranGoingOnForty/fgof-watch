name: CI

on:
  push:
    branches:
      - trunk
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Fortran toolchain
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: latest

      - name: Set up fpm
        if: runner.os != 'macOS'
        uses: fortran-lang/setup-fpm@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fpm-version: v0.13.0

      - name: Install fpm with Homebrew
        if: runner.os == 'macOS'
        run: |
          brew tap fortran-lang/homebrew-fortran
          brew install fpm

      - name: Show tool versions
        run: |
          fpm --version
          "$FC" --version
          "$CC" --version

      - name: Run test suite
        run: fpm test
